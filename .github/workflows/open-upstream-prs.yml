# Open the upstream pull request for each verified artifact branch on this fork.
#
# WHY THIS EXISTS. The agent that produces the proofs can push branches here, but it cannot open
# pull requests on open-goat/pequalnp-proofs. Two independent blocks: a cross-fork pull request
# POSTs to the BASE repository and the Claude GitHub App is not installed there (403 Resource not
# accessible by integration), and the agent's container proxies api.github.com and github.com by
# repository allowlist, so no credential reaches upstream from it. GitHub Actions has neither
# problem, and the token stays in this repository's secret store.
#
# SETUP, once:
#   1. Create a CLASSIC personal access token with the `public_repo` scope.
#      A fine-grained token CANNOT do this: fine-grained tokens only grant permissions on
#      repositories you administer, and you do not administer open-goat/pequalnp-proofs.
#   2. Add it here as a repository secret named PNP_PR_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#
# The agent triggers this itself after pushing a branch, so no clicks are needed. The schedule
# below is only a fallback: GitHub disables scheduled workflows in forks by default, so do not
# rely on it.
#
# SAFETY. This never trusts a branch name. For each candidate it asks the upstream compare API
# what the branch actually changes, and opens a pull request only when that is EXACTLY ONE ADDED
# file under lean/PEqualNP/Outside/. The tournament refuses anything else with the fixed sentence
# `one file per pull request, so send each step as its own pull request`, and that already
# happened once when a pull request was opened from the agent's working branch by mistake.

name: Open upstream pull requests

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be opened, and create nothing'
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: open-upstream-prs
  cancel-in-progress: false

jobs:
  open:
    if: github.repository == 'KSXGitHub/pequalnp-proofs'
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request for each verified artifact branch
        env:
          GH_TOKEN: ${{ secrets.PNP_PR_TOKEN }}
          FORK: ${{ github.repository }}
          UPSTREAM: open-goat/pequalnp-proofs
          # Either source makes a run dry. The input is per-run, so it cannot be left
          # switched on; the variable persists, which is why it is only ever read, never set
          # from here - a forgotten `true` would silently stop every submission.
          DRY: ${{ (inputs.dry_run || vars.PNP_DRY_RUN == 'true') && 'true' || '' }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret PNP_PR_TOKEN is not set. Add a CLASSIC token with public_repo scope."
            exit 1
          fi
          me="${FORK%%/*}"
          echo "fork $FORK | upstream $UPSTREAM | head owner $me"
          [ "${DRY:-}" = "true" ] && echo "::notice::PNP_DRY_RUN is true, nothing will be created"

          branches="$(gh api "repos/$FORK/branches" --paginate --jq '.[].name' | sort)"
          opened=0; skipped=0; refused=0; failed=0

          while IFS= read -r b; do
            [ -n "$b" ] || continue
            case "$b" in main|master|claude/*) continue ;; esac

            cmp="$(gh api "repos/$UPSTREAM/compare/main...$me:$b" 2>/dev/null)" || cmp=""
            if [ -z "$cmp" ]; then
              echo "REFUSE $b : could not compare it against upstream"
              refused=$((refused+1)); continue
            fi
            # A branch cut from a STALE base passes the three-dot file check (which is what
            # .files is) while a tree-comparing checker sees every file the missing upstream
            # commits touched. That is how a one-file reduction was refused as a 199-file pull
            # request. behind_by is the real signal, so refuse anything not on current upstream.
            # Being behind upstream is NOT a refusal, and treating it as one was a bug that
            # would have blocked every submission overnight: upstream moves about ninety commits
            # an hour, so any branch is stale minutes after it is cut. The evidence that it is
            # harmless is direct - a pull request 195 commits behind was judged on its contents
            # and rejected for reduce-extra, not for file count - and the checker's own log says
            # it reads the pull request THROUGH THE API, which reports the three-dot diff. That
            # diff is what the next test measures.
            behind="$(printf '%s' "$cmp" | jq -r '.behind_by // 0')"
            [ "${behind:-0}" -gt 0 ] && echo "note   $b : $behind commit(s) behind upstream, which does not matter here"
            files="$(printf '%s' "$cmp" | jq -r '.files[]? | [.status,.filename] | @tsv')"
            if [ -z "$files" ]; then
              echo "REFUSE $b : adds nothing against upstream (stale branch)"
              refused=$((refused+1)); continue
            fi
            n="$(printf '%s\n' "$files" | grep -c .)"
            status="$(printf '%s\n' "$files" | head -1 | cut -f1)"
            name="$(printf '%s\n' "$files" | head -1 | cut -f2)"

            if [ "$n" -ne 1 ]; then
              echo "REFUSE $b : touches $n files, must be exactly 1"
              refused=$((refused+1)); continue
            fi
            if [ "$status" != "added" ]; then
              echo "REFUSE $b : $name is $status, must be added"
              refused=$((refused+1)); continue
            fi
            case "$name" in
              lean/PEqualNP/Outside/L_*.lean|lean/PEqualNP/Outside/R_*.lean) ;;
              *) echo "REFUSE $b : $name is not a proof file under lean/PEqualNP/Outside/"
                 refused=$((refused+1)); continue ;;
            esac

            # DOES THE FILE ALREADY EXIST UPSTREAM? This is the real test for "this branch adds
            # nothing", and the guard whose absence opened six junk pull requests on a third
            # party's repository. Six stale branches here each carried an old commit that the
            # compare API still reads as one ADDED file, because that comparison runs from the
            # MERGE BASE: measured against current upstream, those files had been merged long
            # ago. A local three-dot diff showed zero files while the API showed one, and only
            # the API's answer was being checked.
            # Asking whether the path already exists upstream answers the question directly,
            # without trusting a branch name, a merge base, or how far the branch has drifted.
            # It also guards the race that matters day to day: if a sibling's proof of the same
            # step is merged while ours is being written, ours adds nothing and must not be sent.
            # Fail CLOSED: tell a 404 (genuinely absent) from any other failure, and refuse on
            # anything we cannot read, because an unreadable answer is not a "no".
            http="$(gh api "repos/$UPSTREAM/contents/$name?ref=main" \
                      -i --cache 0 2>/dev/null | head -1 || true)"
            case "$http" in
              *" 404"*) ;;
              *" 200"*) echo "REFUSE $b : $name already exists upstream, so this adds nothing"
                        refused=$((refused+1)); continue ;;
              *)        echo "REFUSE $b : could not tell whether $name exists upstream (${http:-no response})"
                        refused=$((refused+1)); continue ;;
            esac

            # Scope the duplicate test to OUR pull requests. `--head` matches on branch NAME
            # alone, and every contributor names branches after the step id, so a sibling's
            # pull request from their own fork collides with ours. That is not theoretical: a
            # verified proof of L-meta-3935 was skipped because another fork's PR #9221 used the
            # same branch name, and the run reported "opened 0" as though all was well. A
            # false skip silently drops a submission, so it is worse than a duplicate, which the
            # upstream checker would at least reject visibly.
            # Fail CLOSED on a query error even so: a transient failure must not open a duplicate.
            if ! existing="$(gh pr list --repo "$UPSTREAM" --author "$me" --state all --limit 300 \
                               --json number,headRefName \
                               --jq ".[] | select(.headRefName == \"$b\") | .number" 2>&1)"; then
              echo "REFUSE $b : could not check for an existing pull request, so not opening one"
              echo "           ($existing)"
              refused=$((refused+1)); continue
            fi
            existing="$(printf '%s' "$existing" | tr '\n' ' ' | tr -s ' ')"
            if [ -n "${existing// /}" ]; then
              echo "SKIP   $b : already has pull request(s) $existing"
              skipped=$((skipped+1)); continue
            fi

            if [ "${DRY:-}" = "true" ]; then
              echo "WOULD  $b : adds $name"; continue
            fi
            if url="$(gh pr create --repo "$UPSTREAM" --head "$me:$b" --base main \
                        --title "$b" --body "" 2>&1)"; then
              echo "OPENED $b : $url"; opened=$((opened+1))
            else
              echo "FAILED $b : $url"; failed=$((failed+1))
            fi
          done <<< "$branches"

          echo "opened $opened | skipped $skipped | refused $refused | failed $failed"
          {
            echo "### Upstream pull requests"
            echo "opened **$opened**, skipped $skipped, refused $refused, failed $failed"
            echo ""
            echo "A refused branch is not a failed proof: it means the branch is not shaped like"
            echo "one added proof file, so upstream would refuse it anyway."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -gt 0 ] && exit 1 || exit 0
