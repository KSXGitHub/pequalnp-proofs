# Report the state and checker verdict of every pull request of ours upstream.
#
# READ ONLY: opens nothing, closes nothing, comments nowhere. It exists because the agent's
# container refuses open-goat/pequalnp-proofs over the API, the HTML page and gh alike
# ("sessions are bound to their configured repositories"), so it cannot read even a verdict
# comment. It CAN read this fork's Actions logs, so this workflow is its window onto upstream.
#
# The parsing lives in tools/pnp-harness/lib/verdict.py with unit tests, not in shell here. Two
# bugs are why: a keyword grep over an Actions log reported the checker's OWN SOURCE, because
# Actions echoes each script line with an ANSI 36;1 prefix and those lines contain the words
# being grepped for; and piping a long log into `head` killed the writer with SIGPIPE. Both are
# now fixtures in tests/test_verdict.py.

name: Upstream pull request status

on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'

permissions:
  contents: read

jobs:
  status:
    if: github.repository == 'KSXGitHub/pequalnp-proofs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Report every upstream pull request of ours
        env:
          GH_TOKEN: ${{ secrets.PNP_PR_TOKEN }}
          FORK: ${{ github.repository }}
          UPSTREAM: open-goat/pequalnp-proofs
        working-directory: tools/pnp-harness
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::secret PNP_PR_TOKEN is not set"; exit 1; fi
          me="${FORK%%/*}"

          # Filter by AUTHOR: gh does not populate headRepositoryOwner for cross-fork pull
          # requests, so selecting on it silently matched nothing.
          prs="$(gh pr list --repo "$UPSTREAM" --author "$me" --state all --limit 300 \
                   --json number,headRefName,state,url,headRefOid \
                   --jq '.[] | [.number,.headRefName,.state,.url,.headRefOid] | @tsv')" || prs=""
          if [ -z "$prs" ]; then echo "no pull requests of ours upstream"; exit 0; fi

          {
            echo "### Upstream pull request status"
            echo ""
            echo "| PR | branch | state | verdict | reason | age |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%-8s %-22s %-8s %-10s %-14s %s\n' PR BRANCH STATE VERDICT REASON AGE

          while IFS=$'\t' read -r num branch state url oid; do
            [ -n "${num:-}" ] || continue
            # DATE THE VERDICT. A repair push does not delete the old verdict comment, so a
            # rejection of a commit that is no longer the head stays visible and reads exactly
            # like a fresh one. I diagnosed this very pull request's rejection twice by inferring
            # the comment's age from repository archaeology, and was wrong both times. The
            # comment body cannot date itself - it names the BASE repository's commit, not this
            # branch's head - so the head commit's date has to be fetched and compared.
            head_at="$(gh api "repos/$UPSTREAM/commits/$oid" --jq '.commit.committer.date' 2>/dev/null)" || head_at=""
            comments="$(gh api "repos/$UPSTREAM/issues/$num/comments" --paginate \
                          --jq '[.[] | {body, created_at}]' 2>/dev/null)" || comments='[]'
            # The tested parser decides; this shell only moves text around.
            eval "$(printf '%s' "$comments" | python3 read_verdict.py --head-committed-at "$head_at")"
            case "${IS_STALE:-unknown}" in
              1)       age="STALE" ;;
              0)       age="current" ;;
              *)       age="age-unknown" ;;
            esac
            printf '%-8s %-22s %-8s %-10s %-14s %s\n' "#$num" "$branch" "$state" "${VERDICT:-none}" "${CODE:-}" "$age"
            echo "| [#$num]($url) | \`$branch\` | $state | **${VERDICT:-none}** | ${CODE:-} | $age |" >> "$GITHUB_STEP_SUMMARY"
            if [ "${IS_STALE:-unknown}" = "1" ]; then
              echo "         NOTE: this verdict was posted ${VERDICT_AT:-?}, BEFORE the current head"
              echo "               commit ${oid:0:10} of ${head_at:-?}. It judged a commit that is no"
              echo "               longer here; the checker has not reported on the head yet."
            fi
            if [ "${IS_REJECTION:-0}" = "1" ] && [ -n "${RUN_ID:-}" ]; then
              echo "         run: https://github.com/$UPSTREAM/actions/runs/$RUN_ID"
              echo "         ---- checker diagnostics ----"
              if log="$(gh run view "$RUN_ID" --repo "$UPSTREAM" --log 2>&1)"; then
                printf '%s' "$log" | python3 read_verdict.py --log --limit 25 | sed 's/^/         | /'
              else
                echo "         | could not read the run log; open it by hand"
              fi
              echo "         ----------------------------"
            fi
          done <<< "$prs"
