# This directory ships no Python package. The file is here because mypy and
# ruff read their configuration from it, and it lives beside the harness rather
# than at the repository root so it cannot collide with upstream's own files.

[tool.mypy]
files = ["lib", "tests"]
mypy_path = "."
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
include = ["lib/**/*.py", "tests/**/*.py", "*.py"]
target-version = "py311"
line-length = 120

[tool.ruff.format]
# per-file-ignores governs the linter, not the formatter, so the legacy four are
# excluded here as well. Reformatting them would be churn in code nobody is
# changing, and it would bury the one diff that matters in noise.
exclude = ["lint.py", "show.py", "skeleton.py", "mkrefute.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF", "EXE", "T20"]

[tool.ruff.lint.per-file-ignores]
# Search scripts are research CLIs: their output IS the result, their asserts ARE
# the structural check on a found circuit, and the randomness is simulated
# annealing, not cryptography.
"search/*.py" = ["T201", "S101", "S311"]
# table1a/ is the same kind of thing: a decider for the recurring
# "Table 1a, 5 by 5, mask N" family, plus the experiments that refuted the
# desk's hinted induced-P4 bound. Output is the result; asserts check a found
# circuit; the randomness samples read-once formulas.
"table1a/*.py" = ["T201", "S101", "S311"]
# submit.py is a CLI whose output is its report, and it shells out to git by
# argument list (never a shell string), which is the safe form S603 warns about.
"submit.py" = ["T201"]

# A test narrows a type with `assert`. S101 rejects one because `python -O`
# strips it, which the test run never does.
"tests/**/*.py" = ["S101"]
# KNOWN DEBT, declared rather than hidden. These four are internal utilities
# written before this directory adopted a standard: they print for a person,
# use percent formatting, and put short statements on one line. They are not
# type-annotated either, which is why mypy's `files` covers lib and tests only.
# The parsing that this directory exists to get right - reading a verdict and
# filtering a log - lives in lib/ under strict types with tests, because that
# is the code that broke twice. Converting these is worth doing when one of
# them next needs a real change, not as a sweep.
"lint.py" = ["B007", "E401", "E501", "E701", "E702", "E741", "I001", "T201", "UP031"]
"show.py" = ["E401", "E701", "F401", "I001", "T201", "UP031"]
"skeleton.py" = ["E401", "E702", "I001", "T201", "UP031"]
"mkrefute.py" = ["E401", "E702", "I001", "T201", "UP031"]
